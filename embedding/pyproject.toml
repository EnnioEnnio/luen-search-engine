[project]
name = "embedding-service"
version = "0.1.0"
description = "Embedding generation service for Luen Search Engine"
requires-python = ">=3.10"
dependencies = [
    "tqdm",
    "grpcio",
    "grpcio-tools",
    "protobuf",
    "torch",
    "transformers",
    "einops",
    "numpy", 
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["*_pb2.py", "*_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
