name: Nightly Benchmarks

on:
  workflow_dispatch:

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Prepare benchmark queries
        run: |
          ./scripts/generate-bench-queries.sh

      - name: Run benchmarks
        run: |
          make bench | tee bench.txt

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-benchmarks
          path: bench.txt
          retention-days: 90
