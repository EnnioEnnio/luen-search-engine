# Run gofmt, vet, and tests on every pull request.
name: Go CI

on:
  pull_request:
    branches:
      - "*"

jobs:
  build:
    name: Go CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Verify gofmt
        run: |
          set -eo pipefail
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
